<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandbox Browser</title>
<style>
  :root{--bg:#0f1115;--bar:#181b22;--fg:#e8eaf0;--mut:#8a90a0;--acc:#5b8cff;--ok:#2ecc71;--bad:#ff5b6e}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  .bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--bar);border-bottom:1px solid #262a35}
  button{background:#232734;color:var(--fg);border:0;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:15px}
  button:hover:not(:disabled){background:#2d3345}
  button:disabled{opacity:.35;cursor:default}
  #url{flex:1;min-width:0;background:#0f1115;color:var(--fg);border:1px solid #2b3040;border-radius:8px;padding:9px 12px;font-size:14px;outline:0}
  #url:focus{border-color:var(--acc)}
  .opts{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:#13151b;border-bottom:1px solid #262a35;color:var(--mut);font-size:12px}
  .opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .opts input[type=text]{background:#0f1115;color:var(--fg);border:1px solid #2b3040;border-radius:6px;padding:5px 8px;flex:1;min-width:180px;font-size:12px}
  #status{margin-left:auto;display:flex;gap:6px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  #stage{position:relative;flex:1;background:#fff}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #home{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  #home h1{margin:0;font-size:22px}
  #home p{margin:0;color:var(--mut);max-width:460px}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#232734;border:1px solid #333a4d;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center;z-index:5}
  #toast.show{opacity:1}
  #hint{display:none;position:absolute;left:10px;right:10px;bottom:10px;background:#232734;border:1px solid #333a4d;border-radius:10px;padding:10px 12px;font-size:13px;z-index:3}
  #hint button{padding:5px 9px;font-size:12px;margin-left:6px}
</style>
</head>
<body>

<div class="bar">
  <button id="back" title="Quay lại" disabled>←</button>
  <button id="fwd" title="Tiến tới" disabled>→</button>
  <button id="reload" title="Tải lại">⟳</button>
  <button id="homeBtn" title="Trang chủ">⌂</button>
  <input id="url" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Nhập URL hoặc từ khóa rồi Enter...">
  <button id="go">Go</button>
</div>

<div class="opts">
  <label><input type="checkbox" id="optStrict"> Strict (cô lập tuyệt đối, web dễ mất login)</label>
  <label><input type="checkbox" id="optAnti" checked> Anti-Return</label>
  <label><input type="checkbox" id="optProxy"> Proxy</label>
  <input type="text" id="proxyUrl" placeholder="https://ten-worker.xxx.workers.dev" autocapitalize="off" spellcheck="false">
  <span id="status"><span class="dot"></span><span>Sandbox ON</span></span>
</div>

<div id="stage">
  <div id="home">
    <h1>🛡️ Sandbox Browser</h1>
    <p>Mọi link bạn nhập hoặc bấm bên trong đều bị nhốt trong khung này. Trang con không thể điều hướng tab chính, không mở popup, không bật alert/modal.</p>
  </div>
  <div id="hint">
    Thấy "từ chối kết nối" / trang trắng? Web đó chặn nhúng iframe, cần bật Proxy.
    <button id="hintProxy">Bật Proxy</button><button id="hintClose">Đóng</button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  'use strict';

  // ====== CẤU HÌNH ======
  // Điền sẵn URL Worker của bạn ở đây để khỏi nhập lại (vd: 'https://sbproxy.ten-ban.workers.dev')
  const DEFAULT_PROXY = 'https://browser.nhatanhngo627.workers.dev';
  const PARAM = '__px';                       // phải khớp với worker.js
  const SEARCH = 'https://html.duckduckgo.com/html/?q=';
  // =======================

  const $ = id => document.getElementById(id);
  const stage = $('stage'), home = $('home'), urlIn = $('url'), toast = $('toast'), hint = $('hint');
  let stack = [], idx = -1, frame = null, hintTimer = null;

  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
  };

  function notify(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(notify.t); notify.t = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ---- Proxy ----
  function proxyPrefix(){
    let v = $('proxyUrl').value.trim();
    if(!v) return '';
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    if(v.includes('?')) return v;               // đã có sẵn ?__px=
    return v.replace(/\/+$/, '') + '/?' + PARAM + '=';
  }
  const proxyOn = () => $('optProxy').checked && !!proxyPrefix();

  $('proxyUrl').value = store.get('sb_proxy') || DEFAULT_PROXY;
  $('optProxy').checked = !!$('proxyUrl').value;
  $('proxyUrl').addEventListener('change', () => {
    store.set('sb_proxy', $('proxyUrl').value.trim());
    if($('proxyUrl').value.trim()) $('optProxy').checked = true;
    stack[idx] && navigate(stack[idx], false);
  });

  // ---- Chuẩn hóa URL ----
  function normalize(raw){
    raw = raw.trim();
    if(!raw) return null;
    if(!/^[a-z][a-z0-9+.-]*:/i.test(raw)){
      if(/^[^\s]+\.[^\s]{2,}(\/.*)?$/.test(raw) || /^localhost(:\d+)?/.test(raw)) raw = 'https://' + raw;
      else return SEARCH + encodeURIComponent(raw);
    }
    let u;
    try { u = new URL(raw); } catch { return SEARCH + encodeURIComponent(raw); }
    if(u.protocol !== 'http:' && u.protocol !== 'https:'){ notify('Chỉ cho phép http/https'); return null; }
    let pOrigin = ''; try{ pOrigin = new URL(proxyPrefix()).origin; }catch{}
    if(u.origin === location.origin || (pOrigin && u.origin === pOrigin)){ notify('Không cho nhúng chính trang này / proxy'); return null; }
    return u.href;
  }

  function sandboxFlags(){
    // KHÔNG có: allow-top-navigation*, allow-popups*, allow-modals, allow-downloads, allow-pointer-lock
    const f = ['allow-scripts', 'allow-forms'];
    if(!$('optStrict').checked) f.push('allow-same-origin');
    return f.join(' ');
  }

  function buildFrame(src){
    // iframe mới mỗi lần điều hướng -> không dồn entry vào history tab chính
    if(frame){ frame.src = 'about:blank'; frame.remove(); }
    frame = document.createElement('iframe');
    frame.setAttribute('sandbox', sandboxFlags());
    // Proxy cần biết origin của bạn để kiểm tra ALLOWED_ORIGINS
    frame.setAttribute('referrerpolicy', proxyOn() ? 'origin' : 'no-referrer');
    frame.setAttribute('allow', "camera 'none'; microphone 'none'; geolocation 'none'; payment 'none'; usb 'none'; clipboard-read 'none'");
    frame.addEventListener('load', () => {
      if(!proxyOn()){
        hint.style.display = 'block';
        clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.style.display = 'none', 7000);
      }
    });
    stage.appendChild(frame);
    home.style.display = 'none';
    hint.style.display = 'none';
    frame.src = src;
  }

  function navigate(raw, push = true){
    const url = normalize(raw);
    if(!url) return;
    if(push){ stack = stack.slice(0, idx + 1); stack.push(url); idx = stack.length - 1; }
    urlIn.value = url;
    buildFrame(proxyOn() ? proxyPrefix() + encodeURIComponent(url) : url);
    syncButtons();
  }

  function syncButtons(){
    $('back').disabled = idx <= 0;
    $('fwd').disabled = idx >= stack.length - 1;
  }

  // ---- Đồng bộ thanh địa chỉ khi bấm link trong trang (qua proxy, trang tự báo URL) ----
  window.addEventListener('message', e => {
    if(!frame || e.source !== frame.contentWindow) return;
    const d = e.data;
    if(!d || d.__sb !== 1 || typeof d.url !== 'string') return;
    let u; try{ u = new URL(d.url); }catch{ return; }
    if(!/^https?:$/.test(u.protocol)) return;
    const h = u.href;
    if(h !== stack[idx]){
      if(h === stack[idx - 1]) idx--;
      else if(h === stack[idx + 1]) idx++;
      else { stack = stack.slice(0, idx + 1); stack.push(h); idx = stack.length - 1; }
      syncButtons();
    }
    urlIn.value = h;
  });

  // ---- Nút ----
  $('go').onclick = () => navigate(urlIn.value);
  urlIn.addEventListener('keydown', e => { if(e.key === 'Enter') navigate(urlIn.value); });
  urlIn.addEventListener('focus', () => urlIn.select());
  $('back').onclick = () => { if(idx > 0){ idx--; navigate(stack[idx], false); } };
  $('fwd').onclick = () => { if(idx < stack.length - 1){ idx++; navigate(stack[idx], false); } };
  $('reload').onclick = () => { if(stack[idx]) navigate(stack[idx], false); };
  $('homeBtn').onclick = () => {
    if(frame){ frame.src = 'about:blank'; frame.remove(); frame = null; }
    home.style.display = 'flex'; urlIn.value = ''; hint.style.display = 'none';
  };
  $('optStrict').onchange = () => { stack[idx] && navigate(stack[idx], false); notify($('optStrict').checked ? 'Strict ON' : 'Strict OFF'); };
  $('optProxy').onchange = () => { stack[idx] && navigate(stack[idx], false); };
  $('hintClose').onclick = () => hint.style.display = 'none';
  $('hintProxy').onclick = () => {
    hint.style.display = 'none';
    if(!$('proxyUrl').value.trim()){ $('proxyUrl').focus(); notify('Dán URL Worker vào ô Proxy trước'); return; }
    $('optProxy').checked = true;
    stack[idx] && navigate(stack[idx], false);
  };

  // ---- ANTI-RETURN ----
  function armHistoryTrap(){
    try{
      history.replaceState({ trap: 0 }, '', location.href);
      history.pushState({ trap: 1 }, '', location.href);
    }catch{}
  }
  window.addEventListener('popstate', () => {
    if(!$('optAnti').checked) return;
    try{ history.pushState({ trap: 1 }, '', location.href); }catch{}
    if(idx > 0){ $('back').click(); notify('Back nội bộ (tab chính đứng yên)'); }
    else notify('Đã chặn quay lại tab ngoài');
  });
  armHistoryTrap();

  window.addEventListener('beforeunload', e => {
    if($('optAnti').checked && frame){ e.preventDefault(); e.returnValue = ''; }
  });

  window.open = () => { notify('Popup bị chặn'); return null; };

  window.addEventListener('keydown', e => {
    if(!$('optAnti').checked || !e.altKey) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); $('back').click(); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); $('fwd').click(); }
  });

  // Mở thẳng bằng ?u=https://example.com
  const q = new URLSearchParams(location.search).get('u');
  if(q) navigate(q);
})();
</script>
</body>
</html>
